name: Build instalador Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: NoteDeck-Setup
          path: release/NoteDeck-Setup-*.exe
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notedeck-${{ github.run_number }}
          name: NoteDeck (Windows)
          files: release/NoteDeck-Setup-*.exe
